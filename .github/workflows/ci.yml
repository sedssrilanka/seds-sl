name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Quality & Testing (Type Check, Lint, Vitest)
  # -------------------------------------------------------------
  validate:
    name: Validate Code & Run Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: TypeScript Check
        run: bun run type-check

      - name: Biome Lint Check
        run: bun run lint

      - name: Vitest Suite
        run: bun run test -- --run

  # -------------------------------------------------------------
  # Job 2: Build Check (Verifies Next.js Production Build)
  # -------------------------------------------------------------
  build:
    name: Build & Verify Artifacts
    needs: [validate]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        env:
          NEXT_PUBLIC_SERVER_URL: "https://sedssl.org"
          RESEND_API_KEY: "dummy-key-for-build"
          KEYSTATIC_GITHUB_CLIENT_ID: "dummy-github-client-id"
          KEYSTATIC_GITHUB_CLIENT_SECRET: "dummy-github-client-secret"
          KEYSTATIC_SECRET: "ci-dummy-keystatic-secret-key-32chars"
        run: bun run build:worker

  # -------------------------------------------------------------
  # Job 3: Deploy Preview to Cloudflare Workers (Only for 'dev' branch)
  # -------------------------------------------------------------
  deploy-preview:
    name: Deploy to Cloudflare Workers (Preview)
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build Cloudflare Worker
        env:
          NEXT_PUBLIC_SERVER_URL: "https://preview.sedssl.org"
          RESEND_API_KEY: "dummy-key-for-build"
          KEYSTATIC_GITHUB_CLIENT_ID: "dummy-github-client-id"
          KEYSTATIC_GITHUB_CLIENT_SECRET: "dummy-github-client-secret"
          KEYSTATIC_SECRET: "ci-dummy-keystatic-secret-key-32chars"
        run: bun run build:worker

      - name: Deploy Preview to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # -------------------------------------------------------------
  # Job 4: Deploy Production to Cloudflare Workers (Only for 'main' branch)
  # -------------------------------------------------------------
  deploy-production:
    name: Deploy to Cloudflare Workers (Production)
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build Cloudflare Worker
        env:
          NEXT_PUBLIC_SERVER_URL: "https://sedssl.org"
          RESEND_API_KEY: "dummy-key-for-build"
          KEYSTATIC_GITHUB_CLIENT_ID: "dummy-github-client-id"
          KEYSTATIC_GITHUB_CLIENT_SECRET: "dummy-github-client-secret"
          KEYSTATIC_SECRET: "ci-dummy-keystatic-secret-key-32chars"
        run: bun run build:worker

      - name: Deploy Production to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
