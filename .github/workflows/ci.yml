name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Quality & Testing (Type Check, Lint, Vitest)
  # -------------------------------------------------------------
  validate:
    name: Validate Code & Run Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: TypeScript Check
        run: bun run type-check

      - name: Biome Lint Check
        run: bun run lint

      - name: Vitest Suite
        run: bun run test -- --run

  # -------------------------------------------------------------
  # Job 2: Build Check (Verifies Next.js Production Build)
  # -------------------------------------------------------------
  build:
    name: Build & Verify Artifacts
    needs: [validate]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build Application
        env:
          NEXT_PUBLIC_SERVER_URL: "https://sedssl.org"
          RESEND_API_KEY: "dummy-key-for-build"
          KEYSTATIC_GITHUB_CLIENT_ID: "dummy-github-client-id"
          KEYSTATIC_GITHUB_CLIENT_SECRET: "dummy-github-client-secret"
          KEYSTATIC_SECRET: "ci-dummy-keystatic-secret-key-32chars"
        run: bun run build

  # -------------------------------------------------------------
  # Job 3: Deploy Preview to Vercel (Only for 'dev' branch)
  # -------------------------------------------------------------
  deploy-preview:
    name: Deploy to Vercel (Preview)
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Deploy Preview to Vercel
        run: vercel deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # -------------------------------------------------------------
  # Job 4: Deploy Production to Vercel (Only for 'main' branch)
  # -------------------------------------------------------------
  deploy-production:
    name: Deploy to Vercel (Production)
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Deploy Production to Vercel
        run: vercel deploy --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
